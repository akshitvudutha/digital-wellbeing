name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Application and Installer
        run: python build.py

      - name: Read Version
        id: get_version
        run: |
          $ver = python -c "import json; print(json.load(open('version.json'))['version'])"
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Verify Installer Exists
        run: |
          if (!(Test-Path "dist\DigitalWellbeingSetup-${env:VERSION}.exe")) {
            Write-Error "Installer not found at dist\DigitalWellbeingSetup-${env:VERSION}.exe"
            exit 1
          }

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DigitalWellbeingSetup-${{ env.VERSION }}.exe
          name: Digital Wellbeing v${{ env.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
